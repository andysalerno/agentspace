[project]
name = "webui"
version = "0.1.0"
description = "Minimal hosted web UI for AgentSpace"
requires-python = ">=3.13"
dependencies = ["fastapi", "httpx", "jinja2", "python-multipart", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/webui"]

[tool.hatch.build.targets.wheel.force-include]
"src/webui/templates" = "webui/templates"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
