<!DOCTYPE html>
<html lang="en" dir="{{textdirection}}">
  <head>
    <meta charset="utf-8">
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title>{{title}}</title>
    <style>
      :root {
        --font-family-base: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
        --colorBrandBackground: #0f6cbd;
        --colorBrandBackgroundHover: #115ea3;
        --colorBrandForeground1: #0f6cbd;
        --colorNeutralBackground1: #ffffff;
        --colorNeutralBackground2: #fafafa;
        --colorNeutralBackground3: #f5f5f5;
        --colorNeutralBackground4: #f0f0f0;
        --colorNeutralForeground1: #242424;
        --colorNeutralForeground2: #424242;
        --colorNeutralForeground3: #616161;
        --colorNeutralStroke1: #d1d1d1;
        --colorNeutralStroke2: #e0e0e0;
        --colorStatusSuccessBackground1: #f1faf1;
        --colorStatusSuccessForeground1: #107c10;
        --colorStatusWarningBackground1: #fff8f0;
        --colorStatusWarningForeground1: #8a3707;
        --colorStatusDangerBackground1: #fdf3f4;
        --colorStatusDangerForeground1: #b10e1c;
        --shadow8: 0 2px 4px rgba(0, 0, 0, 0.14), 0 0 2px rgba(0, 0, 0, 0.12);
        --shadow16: 0 8px 16px rgba(0, 0, 0, 0.14), 0 0 2px rgba(0, 0, 0, 0.12);
        --borderRadiusMedium: 6px;
        --borderRadiusLarge: 10px;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        margin: 0;
        overflow: hidden;
        background: var(--colorNeutralBackground2);
        color: var(--colorNeutralForeground1);
        font-family: var(--font-family-base);
      }

      agentspace-app {
        display: block;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <agentspace-app></agentspace-app>
    <script type="module" src="/index.js"></script>
  </body>
</html>
