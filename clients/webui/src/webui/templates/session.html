<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Session {{ session.session_id }}</title>
    <style>
      :root {
        --bg: #fbf8f2;
        --panel: #fff;
        --line: #d9d2c7;
        --ink: #1f1a17;
        --muted: #645b54;
        --accent: #9c3d2f;
        --accent-soft: #f0ddd7;
      }
      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: radial-gradient(circle at top, #fffefb, var(--bg));
        color: var(--ink);
      }
      main {
        max-width: 920px;
        margin: 0 auto;
        padding: 28px 20px 40px;
      }
      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }
      .actions {
        display: flex;
        gap: 10px;
      }
      .button, button {
        border: 0;
        border-radius: 999px;
        padding: 10px 16px;
        font: inherit;
        cursor: pointer;
        text-decoration: none;
      }
      .button {
        background: var(--accent-soft);
        color: var(--accent);
      }
      button {
        background: var(--accent);
        color: white;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 18px;
        box-shadow: 0 12px 28px rgba(31, 26, 23, 0.05);
      }
      .meta {
        color: var(--muted);
        margin-bottom: 18px;
      }
      .transcript {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-bottom: 18px;
      }
      .message {
        padding: 14px 16px;
        border-radius: 14px;
        border: 1px solid var(--line);
        white-space: pre-wrap;
      }
      .message.user {
        background: #f4ece3;
      }
      .message.assistant {
        background: #f8f3ee;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 12px;
        border-radius: 14px;
        border: 1px solid var(--line);
        font: inherit;
        min-height: 120px;
        margin-bottom: 12px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="topbar">
        <div>
          <h1>Session {{ session.session_id }}</h1>
          <div class="meta">agent: {{ session.agent_id }} | status: {{ session.status }}</div>
        </div>
        <div class="actions">
          <a class="button" href="/">Back</a>
          <form method="post" action="/sessions/{{ session.session_id }}/reset">
            <button type="submit">Reset</button>
          </form>
        </div>
      </div>
      <section class="panel">
        <div class="transcript">
          {% if session.messages %}
            {% for message in session.messages %}
            <div class="message {{ message.role }}">
              <strong>{{ message.role }}</strong>

              {{ message.content }}
            </div>
            {% endfor %}
          {% else %}
          <div class="meta">No messages yet.</div>
          {% endif %}
        </div>
        <form method="post" action="/sessions/{{ session.session_id }}/messages">
          <textarea name="message" placeholder="Send a message to the session" required></textarea>
          <button type="submit">Send</button>
        </form>
      </section>
    </main>
  </body>
</html>
