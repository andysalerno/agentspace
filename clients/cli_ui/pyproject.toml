[project]
name = "cli-ui"
version = "0.1.0"
description = "Rich terminal UI client for AgentSpace"
requires-python = ">=3.13"
dependencies = ["textual>=8.2.8", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_ui"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
