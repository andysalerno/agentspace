[project]
name = "agentspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-asyncio",
    "pyright",
    "httpx",
    "fastapi",
    "jinja2",
    "uvicorn",
    "httpx2",
]

[tool.uv.workspace]
members = [
    "kernels/kernel",
    "kernels/kernel_acp",
    "kernels/copilot_launch",
    "kernels/kernel_host",
    "gateways/*",
    "channels/*",
    "clients/cli_ui",
]

[tool.uv.sources]
kernel = { workspace = true }
kernel-acp = { workspace = true }
copilot-launch = { workspace = true }
kernel-host = { workspace = true }
gateway = { workspace = true }
gateway-echo = { workspace = true }
gateway-discord = { workspace = true }
gateway-host = { workspace = true }
cli-channel = { workspace = true }
cli-ui = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "channels/cli_channel/tests",
    "clients/cli_ui/tests",
    "gateways/gateway/tests",
    "gateways/gateway_discord/tests",
    "gateways/gateway_echo/tests",
    "gateways/gateway_host/tests",
    "kernels/kernel/tests",
    "kernels/kernel_acp/tests",
    "kernels/copilot_launch/tests",
    "kernels/kernel_host/tests",
]
norecursedirs = [
    "kernels/kernel_claude_code",
    "kernels/kernel_codex",
    "kernels/kernel_copilot",
    "kernels/kernel_echo",
    "kernels/kernel_opencode",
]

[tool.ruff]
target-version = "py313"
extend-exclude = [
    "kernels/kernel_claude_code",
    "kernels/kernel_codex",
    "kernels/kernel_copilot",
    "kernels/kernel_echo",
    "kernels/kernel_opencode",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",    # missing docstring in public module
    "D101",    # missing docstring in public class
    "D102",    # missing docstring in public method
    "D103",    # missing docstring in public function
    "D104",    # missing docstring in public package
    "D107",    # missing docstring in __init__
    "PLR2004", # magic value comparison
    "CPY001",  # copyright notices
    "D203",    # incompatible with D211 (no blank line before class)
    "D213",    # incompatible with D212 (multi-line summary on first line)
    "COM812",  # trailing comma rule conflicts with the formatter
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["INP001", "S101"]
"kernels/kernel_acp/tests/test_acp.py" = ["SLF001"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = [
    "kernels/kernel/src",
    "kernels/kernel_acp/src",
    "kernels/copilot_launch/src",
    "kernels/kernel_host/src",
    "gateways/gateway/src",
    "gateways/gateway_echo/src",
    "gateways/gateway_discord/src",
    "gateways/gateway_host/src",
    "channels/cli_channel/src",
    "clients/cli_ui/src",
]
exclude = [
    ".venv",
    ".pnpm-store",
    "clients/webui/node_modules",
    "kernels/kernel_claude_code",
    "kernels/kernel_codex",
    "kernels/kernel_copilot",
    "kernels/kernel_echo",
    "kernels/kernel_opencode",
]
