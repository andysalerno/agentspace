[project]
name = "agentspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["ruff", "pytest", "pytest-asyncio", "pyright", "httpx", "fastapi", "jinja2", "uvicorn"]

[tool.uv.workspace]
members = ["kernels/*", "services/*", "clients/*", "channels/*"]

[tool.uv.sources]
kernel = { workspace = true }
kernel-echo = { workspace = true }
kernel-copilot = { workspace = true }
kernel-host = { workspace = true }
agent-host = { workspace = true }
client-service = { workspace = true }
webui = { workspace = true }
cli-channel = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",    # missing docstring in public module
    "D101",    # missing docstring in public class
    "D102",    # missing docstring in public method
    "D103",    # missing docstring in public function
    "D104",    # missing docstring in public package
    "D107",    # missing docstring in __init__
    "PLR2004", # magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["INP001", "S101"]
"kernels/kernel_copilot/tests/test_copilot.py" = ["E501", "SLF001"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = [
    "kernels/kernel/src",
    "kernels/kernel_echo/src",
    "kernels/kernel_copilot/src",
    "kernels/kernel_host/src",
    "services/agent_host/src",
    "services/client_service/src",
    "clients/webui/src",
    "channels/cli_channel/src",
]
