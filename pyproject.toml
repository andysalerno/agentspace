[project]
name = "agentspace"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = ["ruff", "pytest", "pytest-asyncio", "pyright", "httpx", "fastapi", "jinja2", "uvicorn"]

[tool.uv.workspace]
members = [
    "kernels/kernel",
    "kernels/kernel_acp",
    "kernels/kernel_host",
    "gateways/*",
    "services/git_agent",
    "channels/*",
    "clients/cli_ui",
]

[tool.uv.sources]
kernel = { workspace = true }
kernel-acp = { workspace = true }
kernel-host = { workspace = true }
gateway = { workspace = true }
gateway-echo = { workspace = true }
gateway-discord = { workspace = true }
gateway-host = { workspace = true }
git-agent = { workspace = true }
cli-channel = { workspace = true }
cli-ui = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "channels/cli_channel/tests",
    "clients/cli_ui/tests",
    "gateways/gateway/tests",
    "gateways/gateway_discord/tests",
    "gateways/gateway_echo/tests",
    "gateways/gateway_host/tests",
    "kernels/kernel/tests",
    "kernels/kernel_acp/tests",
    "kernels/kernel_host/tests",
    "services/git_agent/tests",
]
norecursedirs = [
    "kernels/kernel_claude_code",
    "kernels/kernel_codex",
    "kernels/kernel_copilot",
    "kernels/kernel_echo",
    "kernels/kernel_opencode",
]

[tool.ruff]
target-version = "py313"
extend-exclude = [
    "kernels/kernel_claude_code",
    "kernels/kernel_codex",
    "kernels/kernel_copilot",
    "kernels/kernel_echo",
    "kernels/kernel_opencode",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",    # missing docstring in public module
    "D101",    # missing docstring in public class
    "D102",    # missing docstring in public method
    "D103",    # missing docstring in public function
    "D104",    # missing docstring in public package
    "D107",    # missing docstring in __init__
    "PLR2004", # magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["INP001", "S101"]
"kernels/kernel_acp/tests/test_acp.py" = ["SLF001"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
extraPaths = [
    "kernels/kernel/src",
    "kernels/kernel_acp/src",
    "kernels/kernel_host/src",
    "gateways/gateway/src",
    "gateways/gateway_echo/src",
    "gateways/gateway_discord/src",
    "gateways/gateway_host/src",
    "services/git_agent/src",
    "channels/cli_channel/src",
    "clients/cli_ui/src",
]
exclude = [
    ".agentspace-cache",
    ".venv",
    "clients/webui/node_modules",
    "kernels/kernel_claude_code",
    "kernels/kernel_codex",
    "kernels/kernel_copilot",
    "kernels/kernel_echo",
    "kernels/kernel_opencode",
]
