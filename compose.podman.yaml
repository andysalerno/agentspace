# Override for running the stack on rootless Podman.
#
# Usage:
#   just stack-up-rootless-podman
#
# Replaces the Docker socket bind-mount with the user's rootless Podman socket
# (which exposes the Docker-compatible API). The recipe discovers the daemon's
# socket path, including when invoked through a devcontainer-mounted socket.
# Make sure the user socket is running first:
#   systemctl --user enable --now podman.socket

services:
  # `agent-host` declares depends_on the `*-image` builder services with
  # `condition: service_completed_successfully`. Docker Compose treats that
  # as "build/run, then start dependents". Podman's libpod, however,
  # validates depends_on at container-start time and refuses to start a
  # dependent whose dependencies are not currently "running" -- so it
  # rejects agent-host because the builders have already exited(0).
  #
  # The build phase has already ensured the images exist, so it's safe to
  # drop the runtime dependency under podman.
  agent-host:
    restart: unless-stopped
    depends_on: !reset []
    volumes:
      - ${AGENTSPACE_PODMAN_SOCKET_PATH:?Run through just stack-up-rootless-podman}:/var/run/docker.sock
      - skills:/skills
      - ${AGENTSPACE_HOST_WORKSPACE:-.}/mounts/skills:/builtin-skills:ro
