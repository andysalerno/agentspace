[project]
name = "cli-channel"
version = "0.1.0"
description = "CLI session client for AgentSpace"
requires-python = ">=3.13"
dependencies = ["httpx"]

[project.scripts]
agentspace = "cli_channel.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cli_channel"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
