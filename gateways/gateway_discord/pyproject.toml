[project]
name = "gateway-discord"
version = "0.1.0"
description = "Discord gateway — bridges a Discord bot DM to an AgentSpace agent"
requires-python = ">=3.13"
dependencies = ["gateway", "fastapi", "discord.py>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_discord"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
