[project]
name = "gateway-echo"
version = "0.1.0"
description = "Echo gateway — exposes a test inbox/outbox for the gateway pipeline"
requires-python = ">=3.13"
dependencies = ["gateway", "fastapi"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_echo"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
