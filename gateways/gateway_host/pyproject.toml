[project]
name = "gateway-host"
version = "0.1.0"
description = "Gateway host — runner that selects and executes a gateway implementation"
requires-python = ">=3.13"
dependencies = ["fastapi", "gateway", "gateway-echo", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway_host"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
