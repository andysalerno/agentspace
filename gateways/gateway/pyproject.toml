[project]
name = "gateway"
version = "0.1.0"
description = "AgentSpace gateway abstraction — Protocol, base classes, and shared helpers"
requires-python = ">=3.13"
dependencies = ["httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"
