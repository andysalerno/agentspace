[package]
name = "memory_rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Rust scaffold for the AgentSpace memory service and CLI"
license = "MIT"
publish = false

[[bin]]
name = "memory"
path = "src/main.rs"

[dependencies]
async-trait = "0.1"
axum = "0.8"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
fs4 = { version = "1.1.0", features = ["sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "net", "process", "rt-multi-thread", "signal", "sync", "time", "io-util", "io-std", "fs"] }
tokio-stream = "0.1"
tower-http = { version = "0.6", features = ["timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
