[project]
name = "client-service"
version = "0.1.0"
description = "Client-facing gateway for AgentSpace"
requires-python = ">=3.13"
dependencies = ["fastapi", "httpx", "kernel-host", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/client_service"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
