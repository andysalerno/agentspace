[project]
name = "git-agent"
version = "0.1.0"
description = "GitAgent service for review-gated patch submission"
requires-python = ">=3.13"
dependencies = ["fastapi", "httpx", "pydantic", "uvicorn"]

[dependency-groups]
dev = ["pytest", "ruff", "pyright", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/git_agent"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
venvPath = "../.."
venv = ".venv"
extraPaths = ["src"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D107",
    "PLR2004",
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001", "S101"]
