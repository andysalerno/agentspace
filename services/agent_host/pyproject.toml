[project]
name = "agent-host"
version = "0.1.0"
description = "Agent host prototype for managing kernel-backed sessions"
requires-python = ">=3.13"
dependencies = ["fastapi", "uvicorn", "kernel-host"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_host"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
