name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Repo checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install just
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://just.systems/install.sh | bash -s -- --to "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run containerized checks
        run: CONTAINER_RUNTIME=docker just check-containerized

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
      KERNEL_WORKDIR: /workspace
      RUST_BUILD_PROFILE: debug

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Generate image version
        run: echo "AGENTSPACE_VERSION=$(bash scripts/build-version.sh)" >> "$GITHUB_ENV"

      - name: Build Docker images
        run: docker compose -f compose.yaml -f .github/compose.ci.yaml build
