# Opt-in override for running the Rust client service in place of the Python
# client-service container. Root compose defaults still use the Python service.
#
# Usage:
#   podman compose -f compose.yaml -f compose.client-service-rs.yaml up -d --build client-service

services:
  client-service:
    image: agentspace-client-service-rs:latest
    build:
      context: services/client_service_rs
      dockerfile: Dockerfile
    environment:
      CLIENT_SERVICE_HOST: 0.0.0.0
      CLIENT_SERVICE_PORT: 8002
      CLIENT_SERVICE_AGENT_HOST_BASE_URL: http://agent-host:8001
