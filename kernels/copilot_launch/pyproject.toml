[project]
name = "copilot-launch"
version = "0.1.0"
description = "Shared AgentSpace GitHub Copilot CLI launch semantics"
requires-python = ">=3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_launch"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
