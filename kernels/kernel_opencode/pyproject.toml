[project]
name = "kernel-opencode"
version = "0.1.0"
description = "OpenCode kernel implementation — wraps OpenCode CLI"
requires-python = ">=3.13"
dependencies = ["kernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_opencode"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
