[project]
name = "kernel-codex"
version = "0.1.0"
description = "Codex CLI kernel implementation — wraps OpenAI Codex CLI"
requires-python = ">=3.13"
dependencies = ["kernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_codex"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
