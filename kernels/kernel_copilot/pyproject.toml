[project]
name = "kernel-copilot"
version = "0.1.0"
description = "Copilot CLI kernel implementation — wraps gh copilot"
requires-python = ">=3.13"
dependencies = ["kernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_copilot"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"

