services:
  kernel:
    build:
      context: ../..
      dockerfile: kernels/kernel_host/Dockerfile
      args:
        AGENTSPACE_VERSION: ${AGENTSPACE_VERSION:-dev}
        RUST_BUILD_PROFILE: ${RUST_BUILD_PROFILE:-release}
    env_file:
      - .env
    environment:
      - LOG_LEVEL=DEBUG
      - KERNEL_WORKDIR=${KERNEL_WORKDIR}
    volumes:
      - copilot-config:/root/.copilot

  setup:
    build:
      context: ../..
      dockerfile: kernels/kernel_host/Dockerfile
      args:
        AGENTSPACE_VERSION: ${AGENTSPACE_VERSION:-dev}
        RUST_BUILD_PROFILE: ${RUST_BUILD_PROFILE:-release}
    env_file:
      - .env
    environment:
      - LOG_LEVEL=DEBUG
      - KERNEL_WORKDIR=${KERNEL_WORKDIR}
    volumes:
      - copilot-config:/root/.copilot
    entrypoint: copilot
    stdin_open: true
    tty: true
    working_dir: ${KERNEL_WORKDIR}

volumes:
  copilot-config:
    name: agentspace-kernel_copilot-config
