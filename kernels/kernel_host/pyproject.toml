[project]
name = "kernel-host"
version = "0.1.0"
description = "Kernel host — runner that selects and executes a kernel implementation"
requires-python = ">=3.13"
dependencies = ["fastapi", "kernel", "kernel-claude-code", "kernel-codex", "kernel-copilot", "kernel-echo", "uvicorn"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_host"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
