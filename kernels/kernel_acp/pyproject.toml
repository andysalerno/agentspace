[project]
name = "kernel-acp"
version = "0.1.0"
description = "ACP kernel implementation - wraps an Agent Client Protocol server"
requires-python = ">=3.13"
dependencies = ["kernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_acp"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
