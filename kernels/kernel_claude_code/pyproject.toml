[project]
name = "kernel-claude-code"
version = "0.1.0"
description = "Claude Code kernel implementation — wraps claude CLI"
requires-python = ">=3.13"
dependencies = ["kernel"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kernel_claude_code"]

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
