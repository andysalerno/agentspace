services:

  kernel-host-image:
    image: agentspace-kernel-kernel:latest
    build:
      context: .
      dockerfile: kernels/kernel_host/Dockerfile
      args:
        AGENTSPACE_VERSION: ${AGENTSPACE_VERSION:-dev}
        RUST_BUILD_PROFILE: ${RUST_BUILD_PROFILE:-release}
    command: ["python", "-c", "print('kernel image ready')"]
    restart: "no"

  gateway-host-image:
    image: agentspace-gateway-gateway:latest
    build:
      context: .
      dockerfile: gateways/gateway_host/Dockerfile
      args:
        AGENTSPACE_VERSION: ${AGENTSPACE_VERSION:-dev}
    entrypoint: []
    command: ["python", "-c", "print('gateway image ready')"]
    restart: "no"

  memory:
    image: agentspace-memory:latest
    build:
      context: .
      dockerfile: services/memory_rs/Dockerfile
      args:
        AGENTSPACE_VERSION: ${AGENTSPACE_VERSION:-dev}
        RUST_BUILD_PROFILE: ${RUST_BUILD_PROFILE:-release}
    command: ["--serve", "--host", "0.0.0.0", "--port", "8005"]
    environment:
      - AGENTSPACE_MEMORY_DIR=/var/lib/agentspace/memory
      - LOG_LEVEL=INFO
    healthcheck:
      test:
        [
          "CMD",
          "memory",
          "--uri",
          "http://127.0.0.1:8005",
          "pages",
          "ls",
          "--limit",
          "1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    volumes:
      - memory-data:/var/lib/agentspace/memory
    networks:
      - agentspace

  agent-host:
    image: agentspace-agent-host:latest
    build:
      context: .
      dockerfile: services/agent_host_rs/Dockerfile
      args:
        AGENTSPACE_VERSION: ${AGENTSPACE_VERSION:-dev}
        RUST_BUILD_PROFILE: ${RUST_BUILD_PROFILE:-release}
    depends_on:
      kernel-host-image:
        condition: service_completed_successfully
      gateway-host-image:
        condition: service_completed_successfully
    security_opt:
      - label:disable
    environment:
      - LOG_LEVEL=INFO
      - AGENT_HOST_COPILOT_VOLUME=agentspace-kernel_copilot-config
      - AGENT_HOST_SKILLS_VOLUME=agentspace-skills
      - AGENT_HOST_SKILLS_DIR=/skills
      - AGENT_HOST_SKILL_VOLUME_MEMORY__DATA=${AGENTSPACE_MEMORY_VOLUME:-agentspace-memory-data}
      - AGENT_HOST_DOCKER_NETWORK=agentspace-stack
      - AGENT_HOST_KERNEL_BASE_URL_TEMPLATE=http://{container_name}:8000
      - AGENT_HOST_KERNEL_IMAGE=agentspace-kernel-kernel:latest
      - AGENT_HOST_KERNEL_VSCODE_HOST_IP=0.0.0.0
      - AGENT_HOST_KERNEL_VSCODE_URL_TEMPLATE=http://127.0.0.1:{host_port}
      - AGENT_HOST_GATEWAY_IMAGE=agentspace-gateway-gateway:latest
      - AGENT_HOST_GATEWAY_CLIENT_SERVICE_URL=http://client-service:8002
      - KERNEL_WORKDIR=${KERNEL_WORKDIR}
    ports:
      - "${CONTAINER_AGENT_HOST_PORT:-8001}:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - skills:/skills
      - ${AGENTSPACE_HOST_WORKSPACE:-.}/mounts/skills:/builtin-skills:ro
    networks:
      - agentspace

  client-service:
    image: agentspace-client-service:latest
    build:
      context: .
      dockerfile: services/client_service_rs/Dockerfile
      args:
        AGENTSPACE_VERSION: ${AGENTSPACE_VERSION:-dev}
        RUST_BUILD_PROFILE: ${RUST_BUILD_PROFILE:-release}
    depends_on:
      agent-host:
        condition: service_started
      memory:
        condition: service_healthy
    environment:
      - LOG_LEVEL=INFO
      - CLIENT_SERVICE_AGENT_HOST_BASE_URL=http://agent-host:8001
      - CLIENT_SERVICE_AGENT_HOST_TIMEOUT=60
      - CLIENT_SERVICE_CONNECTION_MODELS_TIMEOUT=15
      - CLIENT_SERVICE_MEMORY_BASE_URL=http://memory:8005
      - CLIENT_SERVICE_MEMORY_TIMEOUT=${CLIENT_SERVICE_MEMORY_TIMEOUT:-60}
      - CLIENT_SERVICE_DB_PATH=/data/client_service.sqlite
      # Base64-encoded 32-byte AEAD master key used to encrypt secret values at
      # rest in the SQLite store. REQUIRED once any secret value has been stored;
      # startup fails if the key is missing or does not match the key that
      # encrypted the existing ciphertext. Generate with:
      #   openssl rand -base64 32
      - CLIENT_SERVICE_SECRET_KEY=${CLIENT_SERVICE_SECRET_KEY:-}
      # Comma-separated browser origins allowed to call client_service. Requests
      # without an Origin header (CLI / service-to-service) are always allowed.
      # Unset falls back to the default local WebUI origins.
      - CLIENT_SERVICE_CORS_ALLOWED_ORIGINS=${CLIENT_SERVICE_CORS_ALLOWED_ORIGINS:-}
    ports:
      - "${CONTAINER_CLIENT_SERVICE_PORT:-8002}:8002"
    volumes:
      - ${AGENTSPACE_HOST_WORKSPACE:-.}/mounts/data/client_service:/data
    networks:
      - agentspace

  webui:
    image: agentspace-webui-webui:latest
    build:
      context: clients/webui
      dockerfile: Dockerfile
      args:
        AGENTSPACE_VERSION: ${AGENTSPACE_VERSION:-dev}
    depends_on:
      client-service:
        condition: service_started
    environment:
      - WEBUI_CLIENT_SERVICE_BASE_URL=http://client-service:8002
      - WEBUI_CLIENT_SERVICE_TIMEOUT=60
    ports:
      - "${CONTAINER_WEBUI_PORT:-8003}:8003"
    networks:
      - agentspace
  # phoenix:
  #   image: arizephoenix/phoenix:latest
  #   ports:
  #     # UI + OTLP HTTP collector
  #     - "6006:6006"
  #     # OTLP gRPC collector
  #     - "4317:4317"
  #   networks:
  #     - agentspace
  #   restart: unless-stopped

networks:
  agentspace:
    name: agentspace-stack

volumes:
  skills:
    name: agentspace-skills
  memory-data:
    name: ${AGENTSPACE_MEMORY_VOLUME:-agentspace-memory-data}
