services:

  kernel-host-image:
    image: agentspace-kernel-kernel:latest
    build:
      context: .
      dockerfile: kernels/kernel_host/Dockerfile
    command: ["python", "-c", "print('kernel image ready')"]
    restart: "no"

  gateway-host-image:
    image: agentspace-gateway-gateway:latest
    build:
      context: .
      dockerfile: gateways/gateway_host/Dockerfile
    entrypoint: []
    command: ["python", "-c", "print('gateway image ready')"]
    restart: "no"

  agent-host:
    image: agentspace-agent-host:latest
    build:
      context: .
      dockerfile: services/agent_host_rs/Dockerfile
      args:
        RUST_BUILD_PROFILE: ${RUST_BUILD_PROFILE:-release}
    depends_on:
      kernel-host-image:
        condition: service_completed_successfully
      gateway-host-image:
        condition: service_completed_successfully
    security_opt:
      - label:disable
    environment:
      - LOG_LEVEL=INFO
      - AGENT_HOST_COPILOT_VOLUME=agentspace-kernel_copilot-config
      - AGENT_HOST_SKILLS_VOLUME=agentspace-skills
      - AGENT_HOST_SKILLS_DIR=/skills
      - AGENT_HOST_DOCKER_NETWORK=agentspace-stack
      - AGENT_HOST_KERNEL_BASE_URL_TEMPLATE=http://{container_name}:8000
      - AGENT_HOST_KERNEL_IMAGE=agentspace-kernel-kernel:latest
      - AGENT_HOST_KERNEL_VSCODE_HOST_IP=0.0.0.0
      - AGENT_HOST_KERNEL_VSCODE_URL_TEMPLATE=http://127.0.0.1:{host_port}
      - AGENT_HOST_GATEWAY_IMAGE=agentspace-gateway-gateway:latest
      - AGENT_HOST_GATEWAY_CLIENT_SERVICE_URL=http://client-service:8002
      - AGENT_HOST_GITAGENT_REMOTE_URL=${AGENT_HOST_GITAGENT_REMOTE_URL:-http://gitagent:8004/repo.git}
      - AGENT_HOST_GITAGENT_PATCH_URL=${AGENT_HOST_GITAGENT_PATCH_URL:-http://gitagent:8004/PatchRequest}
      - AGENT_HOST_GITAGENT_DEFAULT_BRANCH=${AGENT_HOST_GITAGENT_DEFAULT_BRANCH:-main}
      - KERNEL_WORKDIR=${KERNEL_WORKDIR}
    ports:
      - "8001:8001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - skills:/skills
      - ./mounts/skills:/builtin-skills:ro
    networks:
      - agentspace

  client-service:
    image: agentspace-client-service:latest
    build:
      context: .
      dockerfile: services/client_service_rs/Dockerfile
      args:
        RUST_BUILD_PROFILE: ${RUST_BUILD_PROFILE:-release}
    depends_on:
      agent-host:
        condition: service_started
    environment:
      - LOG_LEVEL=INFO
      - CLIENT_SERVICE_AGENT_HOST_BASE_URL=http://agent-host:8001
      - CLIENT_SERVICE_AGENT_HOST_TIMEOUT=60
      - CLIENT_SERVICE_CONNECTION_MODELS_TIMEOUT=15
      - CLIENT_SERVICE_GIT_AGENT_BASE_URL=http://git-agent:8004
      - CLIENT_SERVICE_GIT_AGENT_DATA_VOLUME=${GITAGENT_DATA_VOLUME:-agentspace-git-agent-data}
      - CLIENT_SERVICE_DB_PATH=/data/client_service.sqlite
    ports:
      - "8002:8002"
    volumes:
      - ./mounts/data/client_service:/data
    networks:
      - agentspace

  git-agent:
    image: agentspace-git-agent:latest
    build:
      context: .
      dockerfile: services/git_agent/Dockerfile
    depends_on:
      client-service:
        condition: service_started
    restart: unless-stopped
    environment:
      - LOG_LEVEL=INFO
      - GITAGENT_REPO_PATH=${GITAGENT_REPO_PATH:-/data/repos/repo.git}
      - GITAGENT_DB_PATH=/data/gitagent.sqlite
      - GITAGENT_WORKDIR=/data/worktrees
      - GITAGENT_SCRATCH_PATH=/data/worktrees
      - GITAGENT_CLIENT_SERVICE_BASE_URL=http://client-service:8002
      - GITAGENT_CLIENT_SERVICE_URL=http://client-service:8002
      - GITAGENT_REVIEW_AGENT_ID=git-agent
      - GITAGENT_DEFAULT_BRANCH=${GITAGENT_DEFAULT_BRANCH:-main}
    ports:
      - "8004:8004"
    volumes:
      - git-agent-data:/data
    networks:
      agentspace:
        aliases:
          - gitagent

  webui:
    image: agentspace-webui-webui:latest
    build:
      context: clients/webui
      dockerfile: Dockerfile
    depends_on:
      client-service:
        condition: service_started
    environment:
      - WEBUI_CLIENT_SERVICE_BASE_URL=http://client-service:8002
      - WEBUI_CLIENT_SERVICE_TIMEOUT=60
    ports:
      - "8003:8003"
    networks:
      - agentspace
  # phoenix:
  #   image: arizephoenix/phoenix:latest
  #   ports:
  #     # UI + OTLP HTTP collector
  #     - "6006:6006"
  #     # OTLP gRPC collector
  #     - "4317:4317"
  #   networks:
  #     - agentspace
  #   restart: unless-stopped

networks:
  agentspace:
    name: agentspace-stack

volumes:
  skills:
    name: agentspace-skills
  git-agent-data:
    # Stable named volume so GitAgent's repository and request database survive
    # service/container teardown. Override for deployment-specific isolation.
    name: ${GITAGENT_DATA_VOLUME:-agentspace-git-agent-data}
